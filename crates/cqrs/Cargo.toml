[package]
name = "cqrs-async"
description = "CQRS and event sourcing for async Rust, routed at compile time: commands, queries, projections, subscriptions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true
readme = "../../README.md"
keywords = ["cqrs", "event-sourcing", "ddd", "async", "projection"]
categories = ["asynchronous", "rust-patterns"]
# The API snapshot is the repository's check, not part of the crate.
exclude = ["public-api.txt"]

# Published as `cqrs-async`, written `cqrs::` in code.
[lib]
name = "cqrs"

[features]
# Batteries included: `cargo add cqrs` gets derives, live events, catch-up
# subscriptions and tracking processors. `default-features = false` keeps a
# runtime-agnostic core (contracts, repository, in-memory store, `Stream`).
default = ["derive", "tokio"]
derive = ["dep:cqrs-derive"]
tokio = ["dep:tokio", "dep:futures-util"]
# Events stored as JSON, and upcasters rewriting old shapes: what SQL and
# document stores share (`cqrs-postgres` turns it on).
json = ["dep:serde", "dep:serde_json"]
# The Protobuf codec, for brokers carrying protobuf messages.
protobuf = ["dep:prost"]

[dependencies]
cqrs-derive = { workspace = true, optional = true }
# The `Stream` trait of the contracts: tiny and runtime-agnostic, the one
# axum, async-graphql, tonic, sqlx and SeaORM consume.
futures-core.workspace = true
futures-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "time", "rt", "macros"] }
# Failures that have nowhere to go (an inline handler failing after the commit)
# are logged; `tracing` is runtime-agnostic, so it is not behind a feature.
tracing.workspace = true
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
prost = { version = "0.14", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
futures-util.workspace = true
# The macros' error messages (tests/ui.rs).
trybuild = "1"
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "test-util"] }

[package.metadata.docs.rs]
all-features = true
