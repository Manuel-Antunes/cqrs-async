[package]
name = "cqrs-sea-orm"
description = "SeaORM in the transactions of the cqrs crate's PostgreSQL adapter"
version.workspace = true
edition.workspace = true
# SeaORM 2 needs 1.94; the other crates keep the workspace's MSRV.
rust-version = "1.94"
license.workspace = true
publish.workspace = true

[dependencies]
cqrs-postgres.workspace = true
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio"] }
# Binds SeaORM's statements to sqlx queries on the borrowed transaction.
sea-query-sqlx = { version = "0.9", default-features = false, features = ["sqlx-postgres"] }
async-trait = "0.1"
tokio = { workspace = true, features = ["sync"] }
