[package]
name = "cqrs-postgres"
description = "PoC: PostgreSQL event store and token store for the cqrs crate, over a plain sqlx pool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cqrs = { workspace = true, default-features = false, features = ["json"] }
serde = "1"
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "json", "macros", "sqlx-toml"] }

[dev-dependencies]
cqrs.workspace = true
futures-util.workspace = true
serde = { version = "1", features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
