[package]
name = "cqrs-postgres"
description = "PoC: PostgreSQL event store and token store for the cqrs crate, over a plain sqlx pool"
version.workspace = true
edition.workspace = true
# sqlx 0.9's.
rust-version = "1.94"
license.workspace = true
publish.workspace = true

[features]
# `Postgres::events`: the events service of a log, its processors running on
# Tokio (as sqlx does here).
default = ["tokio"]
tokio = ["cqrs/tokio"]

[dependencies]
cqrs = { workspace = true, features = ["json"] }
futures-util.workspace = true
serde = "1"
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "json", "macros", "sqlx-toml"] }

[dev-dependencies]
cqrs = { workspace = true, features = ["derive", "tokio"] }
serde = { version = "1", features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
