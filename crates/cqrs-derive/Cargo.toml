[package]
name = "cqrs-async-macros"
description = "The attribute and derive macros of cqrs-async (use them through it)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
readme = "../../README.md"
keywords = ["cqrs", "event-sourcing", "macros"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }
proc-macro-crate = "3"
