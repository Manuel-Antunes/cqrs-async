# cargo deny check: the dependency tree's licenses, advisories, bans and
# sources, for the published crates (and what builds them).

[graph]
all-features = true
# The published crates only: the examples and the benchmarks are not
# shipped (the example's GraphQL stack brings MPL-2.0 crates).
exclude = ["blog", "bank", "cqrs-benchmarks", "cqrs-versus"]

[advisories]
# A vulnerability or an unmaintained crate fails the check; yanked versions
# too.
yanked = "deny"

[licenses]
# What a crate may be under to be depended on by an MIT library.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    # The AMQP crate: lapin's protocol crates, and the TLS stack behind its
    # `rustls` feature (with the root certificates' data license).
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Several versions of one crate are reported, not refused: they come from
# the ecosystem (sqlx, SeaORM), not from these crates.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace carry a version too, for publishing.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
