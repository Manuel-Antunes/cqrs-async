[workspace]
resolver = "3"
members = [
    "crates/cqrs",
    "crates/cqrs-derive",
    "crates/cqrs-postgres",
    "crates/cqrs-sea-orm",
    "examples/blog",
    "benchmarks",
    "benchmarks/versus",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace.dependencies]
# Without its default features, so a member can turn them off (the Cargo of
# the MSRV, 1.89, refuses `default-features = false` over a workspace
# dependency that has them on): members ask for the features they use.
cqrs = { path = "crates/cqrs", default-features = false }
cqrs-derive = { path = "crates/cqrs-derive" }
cqrs-postgres = { path = "crates/cqrs-postgres" }
cqrs-sea-orm = { path = "crates/cqrs-sea-orm" }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false }
# Only the event macros are used: without the default features there is no
# `tracing-attributes` (a proc macro, with `syn`) behind the core.
tracing = { version = "0.1", default-features = false, features = ["std"] }

# Benchmarks measure what users get: optimized, with debug info for profilers.
[profile.bench]
debug = true

[profile.release]
debug = "line-tables-only"
