[workspace]
resolver = "3"
members = [
    "crates/cqrs",
    "crates/cqrs-derive",
    "crates/cqrs-postgres",
    "crates/cqrs-sea-orm",
    "crates/cqrs-amqp",
    "examples/blog",
    "examples/bank",
    "benchmarks",
    "benchmarks/versus",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/Manuel-Antunes/cqrs-async"
homepage = "https://manuel-antunes.github.io/cqrs-async/"
publish = false

# The library crates are published as `cqrs-async*` (their code names stay
# `cqrs`, `cqrs_postgres`, `cqrs_sea_orm`, `cqrs_amqp`); members name them by those keys.
[workspace.dependencies]
# Without its default features, so a member can turn them off (the Cargo of
# the MSRV, 1.89, refuses `default-features = false` over a workspace
# dependency that has them on): members ask for the features they use.
cqrs = { package = "cqrs-async", path = "crates/cqrs", version = "0.1.0-alpha.1", default-features = false }
cqrs-derive = { package = "cqrs-async-macros", path = "crates/cqrs-derive", version = "0.1.0-alpha.1" }
cqrs-postgres = { package = "cqrs-async-postgres", path = "crates/cqrs-postgres", version = "0.1.0-alpha.1" }
cqrs-sea-orm = { package = "cqrs-async-sea-orm", path = "crates/cqrs-sea-orm", version = "0.1.0-alpha.1" }
cqrs-amqp = { package = "cqrs-async-amqp", path = "crates/cqrs-amqp", version = "0.1.0-alpha.1" }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false }
# Only the event macros are used: without the default features there is no
# `tracing-attributes` (a proc macro, with `syn`) behind the core.
tracing = { version = "0.1", default-features = false, features = ["std"] }

# Benchmarks measure what users get: optimized, with debug info for profilers.
[profile.bench]
debug = true

[profile.release]
debug = "line-tables-only"
